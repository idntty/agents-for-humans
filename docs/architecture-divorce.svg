<svg xmlns="http://www.w3.org/2000/svg" width="960" height="616" viewBox="0 0 960 616" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/>
    </marker>
  </defs>
  <rect width="960" height="616" fill="#ffffff"/>

  <!-- title -->
  <text x="32" y="36" font-size="18" font-weight="700" fill="#0d1b2a">Two people's agents settle a divorce through a mediator — without sharing a machine</text>
  <text x="32" y="56" fill="#5a6b7d">Three parties, three runtimes, three owners. The only thing they share is a channel that belongs to none of them.</text>

  <!-- mediator -->
  <g>
    <rect x="330" y="84" width="300" height="96" rx="6" fill="#fbf6e9" stroke="#8a6d1f" stroke-width="1.5"/>
    <text x="480" y="108" text-anchor="middle" font-weight="700" fill="#5c4712">Mediator — a person</text>
    <text x="480" y="128" text-anchor="middle" fill="#5c4712" font-size="11.5">Claude Code, laptop, own idntty account</text>
    <text x="480" y="146" text-anchor="middle" fill="#5c4712" font-size="11.5">runs the private lines, keeps the document</text>
    <text x="480" y="166" text-anchor="middle" fill="#8a6d1f" font-style="italic">neutral in A and B · red team in C</text>
  </g>

  <!-- party A -->
  <g>
    <rect x="40" y="300" width="250" height="118" rx="6" fill="#f2f6fa" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="165" y="324" text-anchor="middle" font-weight="700" fill="#1a3a6b">Hale's agent</text>
    <text x="165" y="344" text-anchor="middle" fill="#1a3a6b">Strands Agents SDK · gpt-5.6-luna</text>
    <text x="165" y="362" text-anchor="middle" fill="#1a3a6b" font-size="11">recorded on a laptop · deploys to AgentCore</text>
    <text x="165" y="384" text-anchor="middle" fill="#3b4a5a">registry (shared) + position (own)</text>
    <text x="165" y="402" text-anchor="middle" fill="#3b4a5a" font-style="italic">identical code to the other side</text>
  </g>

  <!-- party B -->
  <g>
    <rect x="670" y="300" width="250" height="118" rx="6" fill="#f2f6fa" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="795" y="324" text-anchor="middle" font-weight="700" fill="#1a3a6b">Marren's agent</text>
    <text x="795" y="344" text-anchor="middle" fill="#1a3a6b">Strands Agents SDK · gpt-5.6-luna</text>
    <text x="795" y="362" text-anchor="middle" fill="#1a3a6b" font-size="11">recorded on a laptop · deploys to AgentCore</text>
    <text x="795" y="384" text-anchor="middle" fill="#3b4a5a">registry (shared) + position (own)</text>
    <text x="795" y="402" text-anchor="middle" fill="#3b4a5a" font-style="italic">identical code to the other side</text>
  </g>

  <!-- idntty core -->
  <g>
    <rect x="330" y="236" width="300" height="200" rx="8" fill="#ffffff" stroke="#0d1b2a" stroke-width="2"/>
    <text x="480" y="260" text-anchor="middle" font-weight="700" fill="#0d1b2a">idntty — owned by none of the three</text>

    <rect x="350" y="276" width="260" height="64" rx="4" fill="#eef3f8" stroke="#3b4a5a"/>
    <text x="480" y="296" text-anchor="middle" font-weight="700" fill="#0d1b2a">Parley · channels (MCP)</text>
    <text x="480" y="314" text-anchor="middle" fill="#3b4a5a">one group room · two private lines</text>
    <text x="480" y="330" text-anchor="middle" fill="#3b4a5a">async, long-poll, 8 tools</text>

    <rect x="350" y="352" width="260" height="70" rx="4" fill="#eef3f8" stroke="#3b4a5a"/>
    <text x="480" y="372" text-anchor="middle" font-weight="700" fill="#0d1b2a">Stash · pages (MCP)</text>
    <text x="480" y="390" text-anchor="middle" fill="#3b4a5a" font-size="12">each agent publishes to its own address</text>
    <text x="480" y="406" text-anchor="middle" fill="#3b4a5a" font-size="11.5">mediator publishes each settlement version</text>
  </g>

  <!-- arrows: parties to parley -->
  <line x1="290" y1="330" x2="350" y2="312" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="670" y1="330" x2="610" y2="312" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <!-- mediator to parley -->
  <line x1="480" y1="180" x2="480" y2="236" stroke="#8a6d1f" stroke-width="1.5" marker-end="url(#ad)" marker-start="url(#ad)"/>
  <!-- parties to stash (publish) -->
  <line x1="290" y1="392" x2="350" y2="392" stroke="#3b4a5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="670" y1="392" x2="610" y2="392" stroke="#3b4a5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <!-- mediator to stash -->
  <path d="M630,132 C710,132 640,380 610,392" fill="none" stroke="#8a6d1f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ad)"/>

  <!-- pages -->
  <g>
    <rect x="40" y="468" width="250" height="60" rx="6" fill="#ffffff" stroke="#3b4a5a" stroke-dasharray="4 3"/>
    <text x="165" y="490" text-anchor="middle" font-weight="700" fill="#0d1b2a">idntty.io/hale</text>
    <text x="165" y="508" text-anchor="middle" fill="#3b4a5a" font-size="11.5">live page: state, reasoning, every message</text>
    <rect x="670" y="468" width="250" height="60" rx="6" fill="#ffffff" stroke="#3b4a5a" stroke-dasharray="4 3"/>
    <text x="795" y="490" text-anchor="middle" font-weight="700" fill="#0d1b2a">idntty.io/marren</text>
    <text x="795" y="508" text-anchor="middle" fill="#3b4a5a" font-size="11.5">live page: state, reasoning, every message</text>
    <rect x="315" y="468" width="330" height="60" rx="6" fill="#fbf6e9" stroke="#8a6d1f" stroke-dasharray="4 3"/>
    <text x="480" y="490" text-anchor="middle" font-weight="700" fill="#5c4712">idntty.io/dealroom/&lt;random&gt;/</text>
    <text x="480" y="508" text-anchor="middle" fill="#5c4712" font-size="11">anonymised settlement, v0 … vN, signed by label</text>
  </g>
  <line x1="165" y1="418" x2="165" y2="468" stroke="#3b4a5a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="795" y1="418" x2="795" y2="468" stroke="#3b4a5a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="480" y1="436" x2="480" y2="468" stroke="#8a6d1f" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- footer rules -->
  <text x="32" y="566" fill="#0d1b2a" font-weight="700">Rules the architecture enforces</text>
  <text x="32" y="584" fill="#3b4a5a">no agent can read the other's page (ownership-scoped tools) · a private line is unreadable by the third party · only what the mediator publishes exists</text>
  <text x="32" y="600" fill="#3b4a5a">a signature names a version by label, in the open · the parties' hosts never talk to each other — nothing here has an inbound port</text>
</svg>
